[buildPlans.CodeMono]
family = "CodeMono"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

codepoints = [
  "basic-latin",
  "latin-1-supplement",
  "latin-extended-a",
  "general-punctuation",
  "currency-symbols",
  "letterlike-symbols",
  "arrows",
  "mathematical-operators",
  "box-drawing",
  "block-elements"
]

  [buildPlans.CodeMono.variants]
  inherits = "ss04"

    [buildPlans.CodeMono.variants.design]
    one = "no-base"
    two = "straight-neck-serifless"
    three = "two-arcs"
    four = "closed-serifless"
    six = "straight-bar"
    nine = "straight-bar"
    zero = "slashed"
    capital-d = "more-rounded-serifless"
    asterisk = "penta-mid"
    ampersand = "upper-open"

[buildPlans.CodeMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.CodeMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.CodeMono.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.CodeMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.CodeMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"


