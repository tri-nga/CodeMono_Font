[buildPlans.CodeMono]
family = "Code Mono"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.CodeMono.variants]
  inherits = "ss04"

    [buildPlans.CodeMono.variants.design]
    one = "no-base"
    two = "straight-neck-serifless"
    three = "two-arcs"
    four = "closed-serifless"
    six = "straight-bar"
    nine = "straight-bar"
    zero = "slashed"
    capital-d = "more-rounded-serifless"
    asterisk = "penta-mid"
    ampersand = "upper-open"

[buildPlans.CodeMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.CodeMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.CodeMono.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.CodeMono.widths.Expanded]
shape = 600
menu = 7
css = "expanded"

[buildPlans.CodeMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.CodeMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"


# ------------------------------
# Build plan per CodeMono Term
# ------------------------------
[buildPlans.CodeMonoTerm]
family = "Code Mono Term"
spacing = "term"       # ottimizzato per terminale
serifs = "sans"
noCvSs = true
exportGlyphNames = false

  [buildPlans.CodeMonoTerm.variants]
  inherits = "ss04"     # puoi ereditare le stesse feature della principale

    [buildPlans.CodeMonoTerm.variants.design]
    one = "no-base"
    two = "straight-neck-serifless"
    three = "two-arcs"
    four = "closed-serifless"
    six = "straight-bar"
    nine = "straight-bar"
    zero = "slashed"
    capital-d = "more-rounded-serifless"
    asterisk = "penta-mid"
    ampersand = "upper-open"

[buildPlans.CodeMonoTerm.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.CodeMonoTerm.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.CodeMonoTerm.widths.Normal]
shape = 500
menu = 5
css = "normal"

[buildPlans.CodeMonoTerm.widths.Expanded]
shape = 600
menu = 7
css = "expanded"

[buildPlans.CodeMonoTerm.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.CodeMonoTerm.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
