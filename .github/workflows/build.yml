name: Build CodeMono + Term

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # controlla ogni giorno

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout repo
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Recupera ultima release Iosevka
      # -------------------------
      - name: Get latest Iosevka version
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # -------------------------
      # Controlla se release esiste già
      # -------------------------
      - name: Check existing release
        id: check_release
        run: |
          if gh release view "${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stop if already built
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Release already exists. Skipping build."
          exit 0

      # -------------------------
      # Dipendenze di sistema
      # -------------------------
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y ttfautohint jq zip

      # -------------------------
      # Clona Iosevka
      # -------------------------
      - name: Clone Iosevka
        run: |
          git clone --depth 1 --branch ${{ steps.version.outputs.version }} https://github.com/be5invis/Iosevka.git

      # -------------------------
      # Copia build plan
      # -------------------------
      - name: Copy build plan
        run: |
          cp private-build-plans.toml Iosevka/

      # -------------------------
      # Setup Node
      # -------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Iosevka/package-lock.json

      # -------------------------
      # Build font principale TTF
      # -------------------------
      - name: Build CodeMono TTF
        working-directory: Iosevka
        run: |
          npm install
          npm run build -- ttf::CodeMono

      # -------------------------
      # Build Term TTF
      # -------------------------
      - name: Build CodeMono Term TTF
        working-directory: Iosevka
        run: |
          npm install
          npm run build -- ttf::CodeMonoTerm

      # -------------------------
      # Zip output
      # -------------------------
      - name: Package fonts
        run: |
          cd Iosevka/dist
          zip -r CodeMono-${{ steps.version.outputs.version }}.zip CodeMono
          zip -r CodeMonoTerm-${{ steps.version.outputs.version }}.zip CodeMonoTerm

      # -------------------------
      # Crea release GitHub
      # -------------------------
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CodeMono + Term ${{ steps.version.outputs.version }}
          files: |
            Iosevka/dist/CodeMono-${{ steps.version.outputs.version }}.zip
            Iosevka/dist/CodeMonoTerm-${{ steps.version.outputs.version }}.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
