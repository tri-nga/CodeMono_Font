name: Build Code Mono

on:
  schedule:
    - cron: '30 19 * * 5' # Esecuzione automatica ogni Venerdi 19:30
  workflow_dispatch:      # Permette l'avvio manuale

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # 1. Checkout del tuo repository privato
      - name: Checkout your repo
        uses: actions/checkout@v6

      # 2. Recupera ultima release di Iosevka
      - name: Get latest Iosevka version
        id: iosevka
        run: |
          VERSION=$(curl -s https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      # 3. Verifica se hai già buildato questa versione
      - name: Check if release already exists
        id: check_release
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.iosevka.outputs.tag }})
          
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Versione già buildata. Skip."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 4. Setup Node.js (richiesto da Iosevka)
      - name: Setup Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # 5. Cache node_modules per velocizzare le build
      - name: Cache Node Modules
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/cache@v5
        with:
          path: iosevka-source/node_modules
          key: ${{ runner.os }}-iosevka-${{ steps.iosevka.outputs.tag }}
          restore-keys: |
            ${{ runner.os }}-iosevka-

      # 6. Installazione dipendenze di sistema
      - name: Install Build Dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint

      # 7. Pulizia eventuale clone precedente
      - name: Remove old source if exists
        if: steps.check_release.outputs.exists == 'false'
        run: |
          if [ -d "iosevka-source" ]; then rm -rf iosevka-source; fi

      # 8. Clone shallow del repo Iosevka
      - name: Clone Iosevka
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git clone --depth 1 --branch ${{ steps.iosevka.outputs.tag }} https://github.com/be5invis/Iosevka.git iosevka-source

      # 9. Build font TTF (tutte le varianti)
      - name: Build Custom Fonts
        if: steps.check_release.outputs.exists == 'false'
        run: |
          cp private-build-plans.toml iosevka-source/
          cd iosevka-source

          npm install

          # Build dei 2 font
          npm run build -- \
            ttf::CodeMono \
            ttf::CodeMonoTerm
          

          # Packaging
          cd dist

          zip -r ../../CodeMono-${{ steps.iosevka.outputs.tag }}.zip CodeMono
          zip -r ../../CodeMonoTerm-${{ steps.iosevka.outputs.tag }}.zip CodeMonoTerm

      # 10. Creazione Release GitHub
      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.iosevka.outputs.tag }}
          name: CodeMono ${{ steps.iosevka.outputs.tag }}
          body: |
            Build automatica TTF completata.

            Varianti incluse:
            - CodeMono
            - CodeMono Term
          files: |
            CodeMono-${{ steps.iosevka.outputs.tag }}.zip
            CodeMonoTerm-${{ steps.iosevka.outputs.tag }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
