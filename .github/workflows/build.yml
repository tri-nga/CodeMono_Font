name: Build Code Mono
on:
  schedule:
    - cron: '30 19 * * 5' # Esecuzione automatica ogni Venerdi 19:30
  workflow_dispatch:      # Permette l'avvio manuale per testare subito

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # 1. Checkout del tuo repository privato per accedere al .toml
      - name: Checkout your repo
        uses: actions/checkout@v4

      # 2. Controllo ultima versione rilasciata da be5invis
      - name: Get latest Iosevka version
        id: iosevka
        run: |
          VERSION=$(curl -s https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      # 3. Verifica se hai già buildato questa versione specifica nel tuo repo
      - name: Check if release already exists
        id: check_release
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.iosevka.outputs.tag }})
          
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Versione ${{ steps.iosevka.outputs.tag }} già presente. Skipping."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 4. Setup ambiente Node.js (necessario per la build pipeline di Iosevka)
      - name: Setup Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 5. Cache dei node_modules per velocizzare installazioni future
      - name: Cache Node Modules
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/cache@v3
        with:
          path: iosevka-source/node_modules
          key: ${{ runner.os }}-iosevka-${{ steps.iosevka.outputs.tag }}
          restore-keys: |
            ${{ runner.os }}-iosevka-

      # 6. Installazione dipendenze di sistema (ttfautohint serve per i TTF di qualità)
      - name: Install Build Dependencies
        if: steps.check_release.outputs.exists == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ttfautohint

      # 7. Clone "shallow" (veloce) del solo tag interessato
      - name: Clone Iosevka
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git clone --depth 1 --branch ${{ steps.iosevka.outputs.tag }} https://github.com/be5invis/Iosevka.git iosevka-source

      # 8. Esecuzione build mirata solo ai TTF per i tuoi due piani
      - name: Build Custom Font (TTF Only)
        if: steps.check_release.outputs.exists == 'false'
        run: |
          cp private-build-plans.toml iosevka-source/
          cd iosevka-source
          npm install
          # Buildiamo solo il target TTF
          npm run build -- ttf::CodeMono ttf::CodeMonoTerm
          
          # Ci spostiamo nella cartella dist dove sono stati generati i font
          # La struttura sarà dist/CodeMono/TTF e dist/CodeMonoTerm/TTF
          cd dist
          
          # Usiamo il comando find per raccogliere tutti i TTF in modo sicuro 
          # e li mettiamo in uno zip nella root del progetto
          find . -name "*.ttf" | zip -@ ../../Iosevka-CodeMono-TTF.zip

      # 9. Pubblicazione della Release con l'allegato
      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.iosevka.outputs.tag }}
          name: Iosevka Custom ${{ steps.iosevka.outputs.tag }}
          body: "Build TTF completata con successo per CodeMono e CodeMonoTerm."
          files: Iosevka-CodeMono-TTF.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
