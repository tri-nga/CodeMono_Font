name: Build Code Mono

on:
  schedule:
    - cron: '0 10 * * 6'  # Sabato alle 10:00 UTC
    - cron: '0 13 * * 3'  # Mercoledì alle 13:00 UTC
  workflow_dispatch:      # Permette l'avvio manuale

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      # 1. Checkout del repository
      - name: Checkout your repo
        uses: actions/checkout@v6

      # 2. Recupera ultima release di Iosevka
      - name: Get latest Iosevka version
        id: iosevka
        run: |
          VERSION=$(curl -s https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      # 3. Verifica se la release esiste già
      - name: Check if release already exists
        id: check_release
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ steps.iosevka.outputs.tag }})
          
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Versione già buildata. Skip."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # 4. Setup Node.js
      - name: Setup Node.js
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      # 5. Cache node_modules
      - name: Cache Node Modules
        if: steps.check_release.outputs.exists == 'false'
        uses: actions/cache@v5
        with:
          path: iosevka-source/node_modules
          key: ${{ runner.os }}-iosevka-${{ steps.iosevka.outputs.tag }}
          restore-keys: |
            ${{ runner.os }}-iosevka-

      # 6. Pulizia eventuale clone precedente
      - name: Remove old source if exists
        if: steps.check_release.outputs.exists == 'false'
        run: |
          if [ -d "iosevka-source" ]; then rm -rf iosevka-source; fi

      # 7. Clone shallow del repo Iosevka
      - name: Clone Iosevka
        if: steps.check_release.outputs.exists == 'false'
        run: |
          git clone --depth 1 --branch ${{ steps.iosevka.outputs.tag }} https://github.com/be5invis/Iosevka.git iosevka-source

      # 8. Build font TTF Unhinted
      - name: Build Custom Unhinted Fonts
        if: steps.check_release.outputs.exists == 'false'
        run: |
          cp private-build-plans.toml iosevka-source/
          cd iosevka-source

          npm install

          # Build esclusiva varianti unhinted
          npm run build -- \
            ttf-unhinted::CodeMono \
            ttf-unhinted::CodeMonoTerm
          
          # Packaging
          cd dist

          zip -r ../../CodeMono-${{ steps.iosevka.outputs.tag }}-unhinted.zip CodeMono
          zip -r ../../CodeMonoTerm-${{ steps.iosevka.outputs.tag }}-unhinted.zip CodeMonoTerm

      # 9. Creazione Release GitHub
      - name: Create Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.iosevka.outputs.tag }}
          name: CodeMono ${{ steps.iosevka.outputs.tag }} (Unhinted)
          body: |
            Build automatica TTF Unhinted completata.

            Varianti incluse:
            - CodeMono (Unhinted)
            - CodeMono Term (Unhinted)
          files: |
            CodeMono-${{ steps.iosevka.outputs.tag }}-unhinted.zip
            CodeMonoTerm-${{ steps.iosevka.outputs.tag }}-unhinted.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
