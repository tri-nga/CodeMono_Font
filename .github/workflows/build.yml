name: Build CodeMono + Term

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * 3" # mercoledì 07:00

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -------------------------
      # Checkout repo
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # Recupera ultima release upstream
      # -------------------------
      - name: Get latest Iosevka version
        id: version
        run: |
          VERSION=$(curl -s https://api.github.com/repos/be5invis/Iosevka/releases/latest | jq -r .tag_name)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # -------------------------
      # Controlla se release già esiste
      # -------------------------
      - name: Check existing release
        id: check_release
        run: |
          if gh release view "${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Log skip (solo informativo)
      # -------------------------
      - name: Skip build info
        if: steps.check_release.outputs.exists == 'true'
        run: echo "No new upstream release. Skipping build."

      # -------------------------
      # Dipendenze sistema
      # -------------------------
      - name: Install dependencies
        if: steps.check_release.outputs.exists != 'true'
        run: |
          sudo apt update
          sudo apt install -y ttfautohint jq zip

      # -------------------------
      # Clone Iosevka
      # -------------------------
      - name: Clone Iosevka
        if: steps.check_release.outputs.exists != 'true'
        run: |
          git clone --depth 1 --branch ${{ steps.version.outputs.version }} https://github.com/be5invis/Iosevka.git

      # -------------------------
      # Copia build plan
      # -------------------------
      - name: Copy build plan
        if: steps.check_release.outputs.exists != 'true'
        run: |
          cp private-build-plans.toml Iosevka/

      # -------------------------
      # Setup Node
      # -------------------------
      - name: Setup Node
        if: steps.check_release.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Iosevka/package-lock.json

      # -------------------------
      # Install npm dependencies (una sola volta)
      # -------------------------
      - name: Install npm deps
        if: steps.check_release.outputs.exists != 'true'
        working-directory: Iosevka
        run: npm install

      # -------------------------
      # Build CodeMono
      # -------------------------
      - name: Build CodeMono TTF
        if: steps.check_release.outputs.exists != 'true'
        working-directory: Iosevka
        run: npm run build -- ttf::CodeMono

      # -------------------------
      # Build CodeMono Term
      # -------------------------
      - name: Build CodeMono Term TTF
        if: steps.check_release.outputs.exists != 'true'
        working-directory: Iosevka
        run: npm run build -- ttf::CodeMonoTerm

      # -------------------------
      # Zip output
      # -------------------------
      - name: Package fonts
        if: steps.check_release.outputs.exists != 'true'
        run: |
          cd Iosevka/dist
          zip -r CodeMono-${{ steps.version.outputs.version }}.zip CodeMono
          zip -r CodeMonoTerm-${{ steps.version.outputs.version }}.zip CodeMonoTerm

      # -------------------------
      # Crea release
      # -------------------------
      - name: Create Release
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CodeMono + Term ${{ steps.version.outputs.version }}
          files: |
            Iosevka/dist/CodeMono-${{ steps.version.outputs.version }}.zip
            Iosevka/dist/CodeMonoTerm-${{ steps.version.outputs.version }}.zip
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
